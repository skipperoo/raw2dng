[package]
name = "raw-dng-converter"
version = "0.1.0"
authors = ["Leonardo"]
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
js-sys = "0.3"
rawloader = "0.37"
rawler = "0.7"
dng = "1.5"
image = "0.24"
flate2 = "1.0"
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1.0", features = ["js"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
]
